[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangaripper"
version = "0.1.0"
description = "MangaZIP: download public chapters and pack them into a PNG ZIP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "soupsieve>=2.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45.0"]
dev = ["pytest>=8.0", "pylint>=3.0"]

[project.scripts]
mangazip = "mangazip:main"

[tool.setuptools]
py-modules = ["mangazip", "mangazip_i18n"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
